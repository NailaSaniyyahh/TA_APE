        .search-box {

            padding: 13px 18px;
            gap: 10px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            transition: border-color 0.2s;
        }
        .search-box:focus-within {
            border-color: #1a1a2e;
        }
        .search-icon { color: #bbb; font-size: 17px; }
        .search-input {
            flex: 1;

        .search-input::placeholder { color: #ccc; }

        } */

        /* Badge metode */
        /* .badge {
            font-size: 10px;
            padding: 2px 7px;
            border-radius: 10px;
            background: #eef0ff;
            color: #5c6bc0;
            float: right;

        } */

        /* Loading */
        /* .loading {

        } */

        /* Empty state */
        /* .empty {
            padding: 16px;

        } */
         /* ── 2 kolom hasil ── */
        .results-grid {
            display: none;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 20px;
        }
        .results-grid.show { display: grid; }

        .col-card {
            background: white;
            border-radius: 14px;
            box-shadow: 0 2px 14px rgba(0,0,0,0.06);
            overflow: hidden;
        }

        /* Header tiap kolom */
        .col-header {
            padding: 14px 18px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.3px;
            border-bottom: 1px solid #f0f0f0;
        }
        .col-header.completion {
            background: #f0f4ff;
            color: #3b5bdb;
        }
        .col-header.bm25 {
            background: #f0faf4;
            color: #2f9e58;
        }
        .col-header span {
            font-weight: 400;
            color: #aaa;
            font-size: 11px;
            margin-left: 6px;
        }

        /* Item buku */
        .book-item {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 12px 18px;

            transition: background 0.15s;
        }
        .book-item:last-child { border-bottom: none; }
        .book-item:hover { background: #fafafa; }

        }

            color: #bbb;

        }

        /* Badge rank berubah */
        .rank-moved {
            font-size: 10px;
            padding: 1px 6px;
            border-radius: 8px;
            margin-left: 4px;
        }
        .rank-up   { background: #e8f8ee; color: #2f9e58; }
        .rank-down { background: #fff0f0; color: #e03131; }
        .rank-same { background: #f5f5f5; color: #aaa; }

        /* Loading & empty */
        .state-msg {
            padding: 20px;
            text-align: center;
            color: #ccc;
            font-size: 13px;

<body>
<div class="container">

    <!-- Header -->
    <div class="header">
        <h1>APE Book Search</h1>
        <!-- <p>Aplikasi Pendukung Eksperimen — simulasi search suggestion<br>
        dengan re-ranking BM25, SBERT, dan Hybrid</p> -->
    </div>

    <!-- Pilih metode -->
    <!-- <div class="method-tabs">
        <button class="method-tab active" data-method="bm25">BM25</button>
        <button class="method-tab" data-method="sbert">SBERT</button>
        <button class="method-tab" data-method="hybrid">Hybrid</button>
    </div> -->
    <!-- Search box -->
    <div class="search-wrapper">
        <div class="search-box">
            <input
                id="searchInput"
                class="search-input"
                type="text"
                placeholder="Ketik judul atau nama penulis..."
                autocomplete="off"
            />
        </div>
        <!-- <div id="dropdown" class="dropdown"></div> -->
    </div>

    <div id="resultsGrid" class="results-grid">

        <!-- Kolom Completion Suggester -->
        <div class="col-card">
            <div class="col-header completion">
                Completion Suggester
            </div>
            <div id="colCompletion">
                <div class="state-msg">Ketik query untuk melihat hasil</div>
            </div>
        </div>

        <!-- Kolom BM25 -->
        <div class="col-card">
            <div class="col-header bm25">
                Re-ranking BM25
            </div>
            <div id="colBM25">
                <div class="state-msg">Ketik query untuk melihat hasil</div>
            </div>
        </div>
        <!-- KOLOM SBERT -->
        <div class="col-card">
            <div class="col-header sbert">
                Re-ranking SBERT 
            </div>
            <div id="colSBERT">
                <div class="state-msg">Ketik query untuk melihat hasil</div>
            </div>
        </div>
        <!-- KOLOM hybrid -->
        <div class="col-card">
            <div class="col-header hybrid">
                Re-ranking Hybrid
            </div>
            <div id="colHybrid">
                <div class="state-msg">Ketik query untuk melihat hasil</div>
            </div>
        </div>
    </div>

</div>

<script>
    const API_BASE   = "http://127.0.0.1:5000";
    const input      = document.getElementById("searchInput");
    const resultsGrid   = document.getElementById("resultsGrid");
    const colCompletion = document.getElementById("colCompletion");
    const colBM25       = document.getElementById("colBM25");
    const colSBERT      = document.getElementById("colSBERT");
    const colHybrid     = document.getElementById("colHybrid");
    let debounce = null;
    let currentQuery  = "";

    
    // window.addEventListener("load", async () => {
    //     sbertDot.className = "sbert-dot loading";
    //     sbertLabel.textContent = "Memuat SBERT model...";
    //     try {
    //         const res  = await fetch(`${API_BASE}/init-sbert`, { method: "POST" });
    //         const data = await res.json();
    //         if (data.model_loaded) {
    //             sbertDot.className   = "sbert-dot ready";
    //             sbertLabel.textContent = "✓ SBERT model siap (all-MiniLM-L6-v2)";
    //         } else {
    //             sbertDot.className   = "sbert-dot error";
    //             sbertLabel.textContent = "⚠️ SBERT model belum siap";
    //         }
    //     } catch (err) {
    //         sbertDot.className   = "sbert-dot error";
    //         sbertLabel.textContent = "⚠️ Tidak bisa konek ke server Flask";
    //     }
    // });

    input.addEventListener("input", () => {
        clearTimeout(debounce);
        currentQuery = input.value.trim();
        if (!currentQuery) {
            hideDropdown(); 
            return; 
        }
        debounce = setTimeout(() => fetchCompare(currentQuery), 300);
    });

    async function fetchCompare(query) {
        showLoading();
        try {
            const res  = await fetch(`${API_BASE}/compare_all_methods?query=${encodeURIComponent(query)}`);
            if (!res.ok) throw new Error(`API Error: ${res.status}`);
            const data = await res.json();
            renderDropdown(data.completion, data.bm25, data.sbert, data.hybrid);
 
        } catch (err) {
            const errorMsg = `<div class="state-msg">❌ ${err.message}</div>`;
            colCompletion.innerHTML = errorMsg;
            colBM25.innerHTML       = errorMsg;
            colSBERT.innerHTML      = errorMsg;
            colHybrid.innerHTML     = errorMsg;
        }
    }
    

    function renderDropdown(completion, bm25, sbert, hybrid) {
        resultsGrid.classList.add("show");

        if (!completion.length && !bm25.length && !sbert.length && !hybrid.length) {
            const emptyMsg = `<div class="state-msg">Tidak ada hasil ditemukan.</div>`;
            colCompletion.innerHTML = emptyMsg;
            colBM25.innerHTML       = emptyMsg;
            colSBERT.innerHTML      = emptyMsg;
            colHybrid.innerHTML     = emptyMsg;
            return;
        }
 
        // Buat rank map dari completion sebagai baseline
        const completionRankMap = {};
        completion.forEach((item, i) => {
            completionRankMap[item.title] = i + 1;
        });

        // items.forEach(item => {
        //     const div = document.createElement("div");
        //     div.className = "dropdown-item";

            // Tampilkan skor sesuai metode
            // let scoreText = "";
            // if (method === "bm25")
            //     scoreText = `BM25: ${item.score_bm25?.toFixed(4) ?? "-"}`;
            // else if (method === "sbert")
            //     scoreText = `SBERT: ${item.score_sbert?.toFixed(4) ?? "-"}`;
            // else
            //     scoreText = `BM25: ${item.score_bm25?.toFixed(3) ?? "-"} | SBERT: ${item.score_sbert?.toFixed(3) ?? "-"} | Hybrid: ${item.score?.toFixed(3) ?? "-"}`;

        //     div.innerHTML = `
        //         <div class="item-title">${item.title}</div>
        //         <div class="item-author">${item.author || ""}</div>
        //     `;

        //     div.addEventListener("click", () => {
        //         input.value = item.title;
        //         hideDropdown();
        //     });

        //     dropdown.appendChild(div);
        // });

        // dropdown.classList.add("show");

        // completion couloms──
        colCompletion.innerHTML = completion.length
            ? completion.map((item, i) => `
                <div class="book-item">
                    <div class="rank-num">${i + 1}</div>
                    <div class="book-info">
                        <div class="book-title">${escHtml(item.title)}</div>
                        <div class="book-author">${escHtml(item.author || "")}</div>
                    </div>
                </div>
            `).join("")
            : `<div class="state-msg">Tidak ada hasil.</div>`;

        // bm25 coloms ──
        colBM25.innerHTML = bm25.length
            ? bm25.map((item, i) => {
                const badge = buildBadge(completionRankMap[item.title], i + 1);
                return `
                    <div class="book-item">
                        <div class="rank-num">${i + 1}</div>
                        <div class="book-info">
                            <div class="book-title">
                                ${escHtml(item.title)} ${badge}
                            </div>
                            <div class="book-author">${escHtml(item.author || "")}</div>
                            <div class="book-score">
                                BM25: ${item.score_bm25 != null ? item.score_bm25.toFixed(4) : "-"}
                            </div>
                        </div>
                    </div>
                `;
            }).join("")
            : `<div class="state-msg">Tidak ada hasil.</div>`;
        
        // sbert coloms
        colSBERT.innerHTML = sbert.length
            ? sbert.map((item, i) => {
                const badge = buildBadge(completionRankMap[item.title], i + 1);
                return `
                    <div class="book-item">
                        <div class="rank-num">${i + 1}</div>
                        <div class="book-info">
                            <div class="book-title">
                                ${escHtml(item.title)} ${badge}
                            </div>
                            <div class="book-author">${escHtml(item.author || "")}</div>
                            <div class="book-score">
                                SBERT: ${item.score_sbert != null ? item.score_sbert.toFixed(4) : "-"}
                            </div>
                        </div>
                    </div>
                `;
            }).join("")
            : `<div class="state-msg">Tidak ada hasil.</div>`;
        
        // Hybrid coloms
        colHybrid.innerHTML = hybrid.length
            ? hybrid.map((item, i) => {
                const badge = buildBadge(completionRankMap[item.title], i + 1);
                return `
                    <div class="book-item">
                        <div class="rank-num">${i + 1}</div>
                        <div class="book-info">
                            <div class="book-title">
                                ${escHtml(item.title)} ${badge}
                            </div>
                            <div class="book-author">${escHtml(item.author || "")}</div>
                            <div class="book-score">
                                Hybrid: ${item.score_hybrid != null ? item.score_hybrid.toFixed(4) : "-"}
                            </div>
                        </div>
                    </div>
                `;
            }).join("")
            : `<div class="state-msg">Tidak ada hasil.</div>`;
    }

    function buildBadge(rankBefore, rankNow) {
        if (rankBefore == null) {
            return `<span class="rank-moved rank-up">baru</span>`;
        }
        const diff = rankBefore - rankNow;
        if (diff > 0)
            return `<span class="rank-moved rank-up">▲ ${diff}</span>`;
        if (diff < 0)
            return `<span class="rank-moved rank-down">▼ ${Math.abs(diff)}</span>`;
        return `<span class="rank-moved rank-same">—</span>`;
    }
    
    function escHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function showLoading() {
        // dropdown.innerHTML = `<div class="loading">Memuat...</div>`;
        // dropdown.classList.add("show");
        resultsGrid.classList.add("show");
        colCompletion.innerHTML = `<div class="state-msg">Memuat...</div>`;
        colBM25.innerHTML       = `<div class="state-msg">Memuat...</div>`;
        colSBERT.innerHTML      = `<div class="state-msg">Memuat...</div>`;
        colHybrid.innerHTML     = `<div class="state-msg">Memuat...</div>`;
    }

    function hideDropdown() {
        resultsGrid.classList.remove("show");
        // dropdown.innerHTML = "";
    }

    document.addEventListener("click", e => {
        if (!e.target.closest(".search-wrapper") && !e.target.closest(".results-grid")) {
            hideDropdown();
        }
    });
</script>
</body>
</html>
